[project]
name = "leadscout"
version = "0.1.0"
description = "Find Indian local businesses with weak or missing websites, audit them, and pitch them by email."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "duckdb>=1.1",
    "fastapi>=0.110",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "overturemaps>=0.10",
    "phonenumbers>=8.13",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "tomli-w>=1.0",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.15"]

[project.scripts]
leadscout = "leadscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Starlette's TestClient nags about httpx -> httpx2; harmless for tests, and not worth a new dependency yet.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
# Real errors only: syntax, undefined names, unused imports and variables, likely bugs. No style churn.
select = ["E4", "E7", "E9", "F", "B"]

# FastAPI's Form(...) and Typer's Option(...) defaults are the intended pattern.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "typer.Option", "typer.Argument"]
