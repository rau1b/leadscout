[project]
name = "leadscout"
version = "0.1.0"
description = "Find Indian local businesses with weak or missing websites, audit them, and pitch them by email."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "duckdb>=1.1",
    "fastapi>=0.110",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "overturemaps>=0.10",
    "phonenumbers>=8.13",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
leadscout = "leadscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
